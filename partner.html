<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Become a Partner | Gatnora</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<nav class="navbar">

    <a href="index.html" class="logo">
        <span>G</span>
        Gatnora
    </a>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
    </div>

</nav>


<div class="form-container">

    <h1>Become a Partner</h1>

    <p class="form-subtitle">
        Earn ₹7 for every successful delivery
        while helping fellow students.
    </p>


    <form id="partnerForm">

        <div class="form-group">

            <label>Name</label>

            <input type="text"
                   id="partnerName"
                   required>

        </div>


        <div class="form-group">

            <label>Hostel Name</label>

            <input type="text"
                   id="partnerHostel"
                   required>

        </div>


        <div class="form-group">

            <label>Block</label>

            <input type="text"
                   id="partnerBlock"
                   required>

        </div>


        <div class="form-group">

            <label>Phone Number</label>

            <input type="tel"
                   id="partnerPhone"
                   required>

        </div>


        <div class="form-group">

            <label>Student ID</label>

            <input type="text"
                   id="studentId"
                   required>

        </div>


        <div class="form-group">

            <label>Availability</label>

            <select id="availability">

                <option>Available</option>

                <option>Not Available</option>

            </select>

        </div>


        <button type="submit"
                class="primary-btn full-button">

            Register as Partner

        </button>

    </form>

</div>


<script src="script.js"></script>

</body>
</html>
