<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Gatnora</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<nav class="navbar">

    <a href="index.html" class="logo">
        <span>G</span>
        Gatnora
    </a>

</nav>


<div class="auth-container">


    <!-- =========================
         USER LOGIN
    ========================== -->

    <div class="auth-card">

        <h1>Welcome Back</h1>

        <p>
            Login to your Gatnora account.
        </p>


        <form id="loginForm">

            <div class="form-group">

                <label>Email</label>

                <input type="email"
                       id="loginEmail"
                       required>

            </div>


            <div class="form-group">

                <label>Password</label>

                <input type="password"
                       id="loginPassword"
                       required>

            </div>


            <button type="submit"
                    class="primary-btn full-button">

                Login

            </button>

        </form>


        <!-- =========================
             ADMIN LOGIN LINK
        ========================== -->

        <div class="admin-login-link">

            <p>Are you an administrator?</p>

            <a href="admin.html">
                Admin Login
            </a>

        </div>

    </div>


    <!-- =========================
         CREATE ACCOUNT
    ========================== -->

    <div class="auth-card">

        <h1>Create Account</h1>

        <p>
            Join Gatnora today.
        </p>


        <form id="registerForm">

            <div class="form-group">

                <label>Name</label>

                <input type="text"
                       id="registerName"
                       required>

            </div>


            <div class="form-group">

                <label>Email</label>

                <input type="email"
                       id="registerEmail"
                       required>

            </div>


            <div class="form-group">

                <label>Password</label>

                <input type="password"
                       id="registerPassword"
                       required>

            </div>


            <button type="submit"
                    class="primary-btn full-button">

                Create Account

            </button>

        </form>

    </div>


</div>


<script src="script.js"></script>

</body>

</html>
