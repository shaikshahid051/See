
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gatnora Admin Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
        }

        header {
            background: #111;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header button {
            background: #fff;
            color: #111;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
        }

        .container {
            padding: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(200px, 1fr));

            gap: 20px;

            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .card h3 {
            color: #777;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 30px;
            font-weight: bold;
        }

        .orders {
            background: white;
            padding: 25px;
            border-radius: 12px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f5f5f5;
        }

        .status {
            font-weight: bold;
        }

    </style>

</head>

<body>

<header>

    <h2>Gatnora Admin</h2>

    <button onclick="logout()">
        Logout
    </button>

</header>


<div class="container">

    <div class="cards">

        <div class="card">

            <h3>Total Users</h3>

            <p id="totalUsers">
                0
            </p>

        </div>


        <div class="card">

            <h3>Total Partners</h3>

            <p id="totalPartners">
                0
            </p>

        </div>


        <div class="card">

            <h3>Total Orders</h3>

            <p id="totalOrders">
                0
            </p>

        </div>

    </div>


    <div class="orders">

        <h2>Recent Orders</h2>

        <table>

            <thead>

                <tr>

                    <th>Hostel</th>
                    <th>Block</th>
                    <th>Room</th>
                    <th>Type</th>
                    <th>Fee</th>
                    <th>Status</th>

                </tr>

            </thead>

            <tbody id="ordersTable">

            </tbody>

        </table>

    </div>

</div>


<script>

    const API_URL =
        "https://gatenora.vercel.app";


    async function loadDashboard() {

        const token =
            localStorage.getItem("adminToken");


        if (!token) {

            window.location.href =
                "admin.html";

            return;
        }


        try {

            const response =
                await fetch(
                    `${API_URL}/api/admin/dashboard`,
                    {
                        headers: {
                            "Authorization":
                                `Bearer ${token}`
                        }
                    }
                );


            const data =
                await response.json();


            if (!data.success) {

                localStorage.removeItem(
                    "adminToken"
                );

                window.location.href =
                    "admin.html";

                return;
            }


            document.getElementById(
                "totalUsers"
            ).textContent =
                data.statistics.totalUsers;


            document.getElementById(
                "totalPartners"
            ).textContent =
                data.statistics.totalPartners;


            document.getElementById(
                "totalOrders"
            ).textContent =
                data.statistics.totalOrders;


            const table =
                document.getElementById(
                    "ordersTable"
                );


            table.innerHTML = "";


            data.orders.forEach(order => {

                const row =
                    document.createElement("tr");


                row.innerHTML = `

                    <td>
                        ${order.hostel || "-"}
                    </td>

                    <td>
                        ${order.block || "-"}
                    </td>

                    <td>
                        ${order.room || "-"}
                    </td>

                    <td>
                        ${order.type || "-"}
                    </td>

                    <td>
                        ₹${order.totalFee || 0}
                    </td>

                    <td class="status">
                        ${order.status || "-"}
                    </td>

                `;


                table.appendChild(row);

            });


        } catch (error) {

            console.error(error);

            alert(
                "Could not connect to server"
            );

        }

    }


    function logout() {

        localStorage.removeItem(
            "adminToken"
        );

        localStorage.removeItem(
            "admin"
        );

        window.location.href =
            "admin.html";

    }


    loadDashboard();

</script>

</body>

</html>
