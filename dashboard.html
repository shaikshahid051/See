<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard | Gatnora</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<nav class="navbar">

    <a href="index.html" class="logo">
        <span>G</span>
        Gatnora
    </a>

    <div class="nav-links">

        <a href="order.html">
            New Delivery
        </a>

        <a href="partner.html">
            Become Partner
        </a>

        <a href="#"
           onclick="logout()">

            Logout

        </a>

    </div>

</nav>


<div class="dashboard">

    <div class="dashboard-top">

        <div>

            <h1 id="welcome">
                Welcome
            </h1>

            <p>
                Manage your Gatnora deliveries.
            </p>

        </div>


        <a href="order.html"
           class="primary-btn">

            + New Delivery

        </a>

    </div>


    <div class="stats">

        <div class="stat-card">

            <p>Total Orders</p>

            <h2 id="totalOrders">0</h2>

        </div>


        <div class="stat-card">

            <p>Active Orders</p>

            <h2 id="activeOrders">0</h2>

        </div>


        <div class="stat-card">

            <p>Gatnora Pass</p>

            <h2 id="subscriptionOrders">
                No Pass
            </h2>

        </div>

    </div>


    <div class="dashboard-section">

        <h2>My Deliveries</h2>

        <div id="ordersList">

            Loading orders...

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
